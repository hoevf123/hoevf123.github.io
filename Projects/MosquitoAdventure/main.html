        this.draw=function(context,drawType){
            if(this.display==false)return;
            if(drawType=="image"){
                context.beginPath();
                var direction=this.direction/Math.abs(this.direction);
                var image=new Image();
                image.src=this.imgSrc;
                context.save();//must written
                context.scale(direction,1);
                context.drawImage(image,(this.x-this.width/2)*direction,this.y-this.height/2,this.width*direction,this.height);
                context.scale(1,1);//restore origin state
                context.restore();//must written
            }
            else {
                var idx = 0;

                context.beginPath();

                context.strokeStyle = this.strokeStyle;

                for (idx = 1; idx < this.objectPoint.length; idx++) {

                }
                context.stroke();
            }

    function AddCustomObject(CustomObjectList,CustomObjectList_Wait,x,y,width,height,name,imgSrc,display,zIndex,eventTransparent){
        var idx;
        if(!(CustomObjectList_Wait==undefined||CustomObjectList_Wait.length<1))
        {
            idx=CustomObjectList_Wait[0];
            CustomObjectList_Wait.shift();
            CustomObjectList[idx]=new CustomObject();
            CustomObjectList[idx].x=x;
            CustomObjectList[idx].y=y;
            CustomObjectList[idx].width=width;
            CustomObjectList[idx].height=height;
            CustomObjectList[idx].name=name;
            CustomObjectList[idx].imgSrc=imgSrc;
            CustomObjectList[idx].id=idx;
            CustomObjectList[idx].zIndex=zIndex;
            CustomObjectList[idx].eventTransparent=eventTransparent;
            if(display==true)CustomObjectList[idx].display=display;
            else CustomObjectList[idx].display=false;
            /*             if(onclickFunction!==undefined)
             CustomObjectList[idx].addCustomObjectEventListener("click",onclickFunction);*/
            return CustomObjectList[idx];
        }
        else{
            idx=CustomObjectList.length;
            CustomObjectList.push(new CustomObject());
            CustomObjectList[idx].x=x;
            CustomObjectList[idx].y=y;
            CustomObjectList[idx].width=width;
            CustomObjectList[idx].height=height;
            CustomObjectList[idx].name=name;
            CustomObjectList[idx].imgSrc=imgSrc;
            CustomObjectList[idx].id=idx;
            CustomObjectList[idx].zIndex;
            CustomObjectList[idx].eventTransparent=eventTransparent;
            if(display==true)CustomObjectList[idx].display=display;
            else CustomObjectList[idx].display=false;
            /*              if(onclickFunction!==undefined)
             CustomObjectList[idx].addCustomObjectEventListener("click",onclickFunction);*/
            return CustomObjectList[idx];
        }
    }


    function DeleteCustomObject(CustomObjectList,CustomObjectList_Wait,idx){
        if(idx>CustomObjectList.length-1&&idx<0){
            console.log("Cannot Delete this index : "+idx);
            return;
        }
        if(idx==CustomObjectList.length-1){
            if(CustomObjectList[idx].movePatternHandler!==undefined)CustomObjectList[idx].removeMovePatternHandler();
            CustomObjectList.pop();
        }
        else{
            CustomObjectList_Wait.push(idx);
            if(CustomObjectList[idx].movePatternHandler!==undefined)CustomObjectList[idx].removeMovePatternHandler();
            CustomObjectList[idx]=undefined;
        }
    }

    function FlushCustomObject(CustomObjectList)
    {
        console.log("CustomObjectList Array Flush Function Occured!!\n");
        var idx;
        for(idx=CustomObjectList.length-1;idx>=0;idx--)
            CustomObjectList.pop();
    }
    function findCustomObjectByName(objName) {
        var idx;
        for (idx = CustomObjectList.length - 1; idx >= 0; idx--) {
            if (CustomObjectList[idx] == undefined)continue;
            if (CustomObjectList[idx].name == objName) {
//                    console.log("found the name By CustomObjectById(" + CustomObjectList[idx].name + ")");
                return CustomObjectList[idx];
            }
        }
//            return console.log("Error : Not found the name By CustomObjectById!!("+objName+")");
    }

    /* appendArrayIndex : used For AddCustomObjectList_new Function, is Formed From Queue Structure*/
    function appendArrayIndex(arr,index,value){
        if(index==undefined||(index==arr.length-1&&index>=0)){
            arr[arr.length]=value;
            arr.length++;
        }
        else{
            for(var i=arr.length;i>index;i--){arr[i]=arr[i-1];}
            arr.length++;
            arr[i]=value;
        }
    }
    /* CustomObject remove Function (Based On id property(replaced as index value) */
    /* removeArrayIndex : is Formed From Queue Structure */
    function removeArrayIndex(arr, index){
        for(var i=index;i<arr.length;i++)
            arr[i]=arr[i+1];
        arr.length-=1;
    }

    function Activity_Test(){
        MySrc.resetCustomScreenState();
        AddCustomObject(CustomObjectList,CustomObjectList_Wait,1024/2,744/2,1024,744,"background","res/background.PNG",true,undefined,true);
        AddCustomObject(CustomObjectList,CustomObjectList_Wait,320,700-25-240,320,480,"tree","res/tree.PNG",true,undefined,true);

            AddCustomObject(CustomObjectList,CustomObjectList_Wait,i*50,700,50,50,"bricks","res/brick.PNG",true);

        function playerKeyDown(e){
            var player=findCustomObjectByName("player");
            switch (e.keyCode){
                case 37://VK_LEFT
                        player.speed_x=-player.width*4;
                    break;
                case 38://VK_UP
                    break;
                case 39://VK_RIGHT
                    player.speed_x=player.width*4;
                    break;
                case 40://VK_DOWN
                    break;
            }
        }
        function playerKeyPress(e){
            var player=findCustomObjectByName("player");
            switch (e.keyCode){
                case 37://VK_LEFT
                    player.speed_x=-player.width*4;
                    break;
                case 38://VK_UP
                    break;
                case 39://VK_RIGHT
                    player.speed_x=player.width*4;
                    break;
                case 40://VK_DOWN
                    break;
            }
        }
        function playerKeyUp(e){
            var player=findCustomObjectByName("player");
            switch (e.keyCode){
                case 37://VK_LEFT
                    player.speed_x=0;
                    break;
                case 38://VK_UP
                    break;
                case 39://VK_RIGHT
                    player.speed_x=0;
                    break;
                case 40://VK_DOWN
                    break;
            }
        }
        findCustomObjectByName("player").onkeydown=playerKeyDown;
        findCustomObjectByName("player").onkeypress=playerKeyPress;
        findCustomObjectByName("player").onkeyup=playerKeyUp;
        findCustomObjectByName("player").hp=600;
        AddCustomObject(CustomObjectList,CustomObjectList_Wait,400,50,400,50,"hp_bar","",true,undefined,true);
        findCustomObjectByName("hp_bar").fillStyle="red";
        function showHPStatusBar(){
            var myCustomObject=findCustomObjectByName("hp_bar");
            var player=findCustomObjectByName("player");
            myCustomObject.hp=player.hp;
        }
        function drawHPStatusBar(context,drawimage){
            var myCustomObject=findCustomObjectByName("hp_bar");
            var max_hp=600;
            if(context==undefined||myCustomObject.display!=true)return;
            context.beginPath();
            context.fillStyle=myCustomObject.fillStyle;
            context.fillRect(myCustomObject.x-max_hp/2,myCustomObject.y-myCustomObject.height/2,myCustomObject.width*myCustomObject.hp/max_hp,myCustomObject.height);
        }
        findCustomObjectByName("hp_bar").draw=drawHPStatusBar;
        MySrc.addCustomScreenTimerFunction(showHPStatusBar);
        function gameTimer(){
            var player=findCustomObjectByName("player");
            if(player.x>600&&player.hp>0)
                player.hp-=1;

            if(player.hp==0){
                player.attackcool=2000;
                player.hp=-1;
                player.removeCustomObjectEventListener("keydown");
                player.removeCustomObjectEventListener("keyup");
                player.removeCustomObjectEventListener("keypress");
            }
            if(player.hp<=0&&player.display==true){
                player.globalAlpha=player.attackcool/2000;
                if(player.attackcool<=0)display=false;
            }
        }
        MySrc.addCustomScreenTimerFunction(gameTimer);
        MySrc.addCustomScreenTimerFunction(MySrc.AttackCool);
    }
